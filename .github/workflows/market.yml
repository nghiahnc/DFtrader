name: Market report
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'history/**'
      - 'state/**'
      - 'site/data/**'
      - '**.md'
permissions:
  contents: read
concurrency:
  group: market-report
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data validation and analysis
        run: python -m unittest discover -v
      - name: Collect and analyze
        id: scan
        continue-on-error: true
        run: python -m dftrader.pipeline
      - name: Notify owner
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python -m dftrader.notify
      - name: Persist observations and alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history site/data state
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh market observations [skip ci]"
            git push origin HEAD:main
          fi
      - name: Package public files only
        id: artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Report scan failure after preserving public report
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Source scan failed. Published status will show the last successful report."
          exit 1
  deploy:
    needs: refresh
    if: ${{ always() && !cancelled() && needs.refresh.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
