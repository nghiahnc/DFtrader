name: Source browser compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Open public source in standard Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              response = page.goto('https://dfloadout.gg/cho-dau-gia?category=5&sort=listed-desc', wait_until='domcontentloaded', timeout=45000)
              print('Initial HTTP:', response.status)
              try:
                  page.wait_for_selector('a.au-card-link', timeout=15000)
                  print('PUBLIC_MARKET_AVAILABLE:', page.locator('a.au-card-link').count())
              except Exception:
                  print('PUBLIC_MARKET_UNAVAILABLE: standard browser could not access listing; no challenge interaction attempted')
              browser.close()
          PY
